name: Predictive Maintenance Python Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test synthetic model training
        run: python main.py --output ci-output
